<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Behemoth · 현재 캐릭터 수정안</title>
<style>*{box-sizing:border-box}body{margin:0;background:#151715;color:#e4dbc5;font:16px system-ui,sans-serif}header{padding:20px 28px}h1{font-size:22px;margin:0 0 8px}p{margin:0;color:#aaa991;line-height:1.5}nav{display:flex;gap:8px;padding:0 28px 16px;flex-wrap:wrap}button{font:inherit;cursor:pointer;padding:10px 22px;background:#272922;color:#e4dbc5;border:1px solid #5b604b;border-radius:4px}button[aria-pressed=true]{background:#c3a15d;color:#151715}main{padding:0 28px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;min-width:0;background:#1b1d19;border:1px solid #3c4035}figcaption{padding:10px 16px;color:#aaa991}img{display:block;width:100%;height:calc(100vh - 260px);min-height:340px;object-fit:contain}footer{padding:16px 28px;color:#aaa991;font-size:14px}a{color:#e1bd75}details{margin-top:18px}summary{cursor:pointer;color:#c3a15d;padding:12px 0}.baselines{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.baselines img{height:60vh;min-height:260px}@media(max-width:600px){header,footer{padding:16px}nav{padding:0 16px 12px}main{padding:0 12px}.pair{gap:8px}img{min-height:260px;height:55vh}h1{font-size:19px}.baselines{gap:4px}.baselines img{height:35vh;min-height:190px}}</style>
<header><h1>현재 수정안 · 워리어 / 남자 사무라이 / 위자드</h1><p id="note"></p></header>
<nav><button id="Warrior" aria-pressed="true" onclick="show('Warrior')">워리어 · 앞 천 정리</button><button id="Samurai" aria-pressed="false" onclick="show('Samurai')">남자 사무라이 · 견갑</button><button id="Wizard" aria-pressed="false" onclick="show('Wizard')">위자드 · 온화한 학자</button></nav>
<main><div class="pair"><figure><figcaption id="oldLabel">원본</figcaption><a id="oldLink" target="_blank"><img id="old" alt="이전 캐릭터"></a></figure><figure><figcaption>수정안</figcaption><a id="newLink" target="_blank"><img id="new" alt="수정 캐릭터"></a></figure></div>
<details><summary>비율 기준 보기 · 몽크 / 원래 워리어 / 바바리안</summary><div class="baselines">
<figure><figcaption>몽크</figcaption><img src="/Assets/Art/Trials/Angular01/SourceMonk.png" alt="몽크 비율 기준"></figure>
<figure><figcaption>워리어 원본</figcaption><img src="/Assets/Art/Trials/Angular01/SourceWarrior.png" alt="워리어 비율 기준"></figure>
<figure><figcaption>바바리안</figcaption><img src="/Assets/Art/Trials/Angular01/Concepts02/Barbarian.png" alt="바바리안 비율 기준"></figure>
</div></details></main>
<footer>현재 디자인 검토용 이미지입니다. 로그는 기존 승인안을 유지합니다. · <a href="../Gallery.html">기존 Unity 실행 화면</a> · <a href="Prompts.json">Built-in ImageGen 프롬프트</a> · <a href="ReviewNotes.md">현재 방향 메모</a></footer>
<script>
const names={Warrior:'워리어',Samurai:'사무라이',Wizard:'위자드'};
const notes={Warrior:'처음의 허름한 천 시안에서 가슴 앞 천의 잔갈래만 정리했습니다.',Samurai:'원래 남자 사무라이의 얼굴·복장·비율을 유지하고 견갑만 강조했습니다.',Wizard:'부드러운 표정의 노학자. 책을 들고, 허리에는 단검을, 등에는 스태프를 맸습니다.'};
function show(name){const root='/Assets/Art/Trials/Angular01/';const old=root+(name==='Wizard'?'Concepts03/Wizard.png':'Source'+name+'.png');const next=root+'Concepts05/'+name+'.png';document.getElementById('old').src=old;document.getElementById('oldLink').href=old;document.getElementById('new').src=next;document.getElementById('newLink').href=next;document.getElementById('old').alt=names[name]+' 이전안';document.getElementById('new').alt=names[name]+' 수정안';document.getElementById('oldLabel').textContent=name==='Wizard'?'이전 위자드':'최초 원본';for(const kind of Object.keys(names))document.getElementById(kind).setAttribute('aria-pressed',String(kind===name));document.getElementById('note').textContent=notes[name];}show('Warrior');
</script></html>
